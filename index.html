<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Based Particles</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Intro Screen -->
    <div id="intro-screen" class="intro-screen">
        <div class="intro-content">
            <h1 class="intro-title">BASED PARTICLES</h1>
            <p class="intro-subtitle">Interactive hand-tracked particle simulation</p>
            <button id="enable-camera-btn" class="enable-btn">
                <span class="btn-icon">◉</span>
                Enable Camera
            </button>
        </div>
        <div class="intro-decoration">
            <div class="glow-orb"></div>
        </div>
    </div>

    <!-- Main Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Baseposting Text Overlay -->
    <div id="baseposting-text" class="baseposting-text hidden">
        <span>baseposting</span>
    </div>

    <!-- Camera Preview -->
    <div id="camera-container" class="camera-container hidden">
        <video id="camera-video" autoplay playsinline></video>
        <canvas id="hand-overlay"></canvas>
    </div>

    <!-- Status Indicator -->
    <div id="status-indicator" class="status-indicator hidden">
        <span class="status-dot"></span>
        <span id="status-text">Initializing...</span>
    </div>

    <!-- MediaPipe Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>

    <!-- Application Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/gestures.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
